services:
  # Kafka
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 30s
      retries: 20
      start_period: 60s

  # Création des topics
  kafka-init:
    image: apache/kafka:3.7.0
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions --partitions 1 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic predictions --partitions 1 --replication-factor 1"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  # PostgreSQL 
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 5s
      retries: 10

  # Spark Streaming (inférence)
  spark-stream:
    image: apache/spark:3.5.1-python3
    user: root
    ports:
      - "4040:4040"
    volumes:
      - ./spark:/opt/app
      - ./models:/models
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: >
      bash -c "pip install -q numpy pandas pyarrow joblib xgboost scikit-learn &&
      /opt/spark/bin/spark-submit
      --master local[2]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1
      --conf spark.jars.ivy=/tmp/.ivy
      /opt/app/stream_inference.py"
    healthcheck:
      # l'UI Spark (4040) répond une fois le job démarré
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4040')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s

  # Consommateurs de predictions 
  db-writer:
    build: ./db-writer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: predictions
      PG_HOST: postgres
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/fraud.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Producer 
  producer:
    build: ./producer
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: transactions
      RATE_PER_SEC: "5"
    volumes:
      - ./data:/opt/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Alertes email quand is_fraud = 1
  mailpit:
    # faux serveur SMTP pour tester : boîte mail sur http://localhost:8025
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"   # interface web
      - "1025:1025"   # SMTP
 
  alerter:
    build: ./alerter
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: predictions
      # --- test avec Mailpit (par défaut) ---
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_STARTTLS: "false"
      MAIL_FROM: fraud-alert@example.com
      MAIL_TO: analyste@example.com
      ALERT_MIN_INTERVAL: "10"
      # --- vrai envoi (ex. Gmail avec un mot de passe d'application) ---
      # SMTP_HOST: smtp.gmail.com
      # SMTP_PORT: "587"
      # SMTP_STARTTLS: "true"
      # SMTP_USER: ton.adresse@gmail.com
      # SMTP_PASSWORD: ${SMTP_PASSWORD}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

volumes:
  pg_data:
  grafana_data: